<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 240px;
        padding: 16px;
        margin: 0;
        background: #fff;
        color: #1c1e21;
      }
      h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .row span {
        font-size: 13px;
      }
      .switch {
        position: relative;
        width: 40px;
        height: 22px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background: #ced0d4;
        border-radius: 22px;
        transition: background 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 2px;
        top: 2px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .switch input:checked + .slider {
        background: #1877f2;
      }
      .switch input:checked + .slider::before {
        transform: translateX(18px);
      }
      .hint {
        font-size: 11px;
        color: #65676b;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Facebook Reels Remover</h1>
    <label class="row">
      <span>Hide Reels</span>
      <span class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </span>
    </label>
    <p class="hint">Applies to the feed on facebook.com.</p>
    <script src="popup.js"></script>
  </body>
</html>
